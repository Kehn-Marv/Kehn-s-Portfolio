<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="artboard.css" />
<style>
  /* Photon, thumbnail-first: question → photon → answer. Three elements,
     scaled for a ~420px-wide card slot. */
  .artboard {
    width: 1250px;
    height: 500px;
    --glow-a: radial-gradient(circle at 16% 30%, rgba(169, 216, 119, 0.34), transparent 32%);
    --glow-b: radial-gradient(circle at 86% 68%, rgba(255, 212, 64, 0.24), transparent 34%);
  }

  .terminal {
    left: 70px;
    top: 96px;
    width: 470px;
    transform: rotate(-2deg);
  }
  .terminal .titlebar { height: 52px; font-size: 24px; }
  .terminal .body {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 30px 28px 34px;
    background: var(--ink);
  }
  .prompt-line {
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--cream);
    font-size: 34px;
    font-weight: 700;
  }
  .prompt-line .chev { color: var(--lime); font-size: 38px; }
  .prompt-line .cursor {
    width: 18px;
    height: 36px;
    background: var(--lime);
  }
  .terminal .bar { --bar-color: var(--cream); --bar-opacity: 0.45; height: 14px; border-radius: 7px; }

  .photon {
    position: absolute;
    left: 542px;
    top: 66px;
  }
  .sparkle { position: absolute; }

  .answer {
    right: 70px;
    top: 130px;
    width: 430px;
    transform: rotate(1.8deg);
  }
  .answer .titlebar { height: 52px; font-size: 24px; --bar: var(--lime); }
  .answer .body {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 26px;
  }
  .summary {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 18px 20px;
    border: 4px solid var(--ink);
    background: var(--yellow);
    box-shadow: 5px 5px 0 var(--ink);
  }
  .summary .bar { --bar-opacity: 0.8; height: 13px; border-radius: 6.5px; }
  .row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .row i {
    flex: none;
    width: 24px;
    height: 24px;
    border: 4px solid var(--ink);
    border-radius: 50%;
    background: var(--lime);
  }
  .row .bar { height: 14px; border-radius: 7px; }
</style>
</head>
<body>
<div class="artboard">
  <svg class="wires" viewBox="0 0 1250 500">
    <path d="M 552 250 C 610 250, 620 210, 668 190" stroke="#a9d877" stroke-width="8" stroke-dasharray="20 15" />
    <path d="M 738 182 C 800 172, 810 216, 856 240" stroke="#ffd440" stroke-width="8" stroke-dasharray="20 15" />
  </svg>

  <div class="card terminal">
    <div class="titlebar"><span class="dots"><i></i><i></i><i></i></span><span class="mono">ptn --ask</span></div>
    <div class="body">
      <div class="prompt-line mono"><span class="chev">❯</span> ptn ask <span class="cursor"></span></div>
      <div class="bar" style="width: 74%"></div>
    </div>
  </div>

  <svg class="photon" width="200" height="200" viewBox="0 0 170 170">
    <path d="M85 8 L104 66 L162 85 L104 104 L85 162 L66 104 L8 85 L66 66 Z"
          fill="#ffd440" stroke="#141111" stroke-width="8" stroke-linejoin="round"
          transform="rotate(12 85 85)" />
    <circle cx="85" cy="85" r="15" fill="#fffaef" stroke="#141111" stroke-width="5" transform="rotate(12 85 85)" />
  </svg>
  <svg class="sparkle" style="left: 512px; top: 40px" width="48" height="48" viewBox="0 0 44 44">
    <path d="M22 2 L27 17 L42 22 L27 27 L22 42 L17 27 L2 22 L17 17 Z" fill="#fe7da8" stroke="#141111" stroke-width="4" stroke-linejoin="round" />
  </svg>
  <svg class="sparkle" style="left: 726px; top: 268px" width="34" height="34" viewBox="0 0 44 44">
    <path d="M22 2 L27 17 L42 22 L27 27 L22 42 L17 27 L2 22 L17 17 Z" fill="#fe7da8" stroke="#141111" stroke-width="5" stroke-linejoin="round" />
  </svg>

  <div class="card answer">
    <div class="titlebar"><span class="dots"><i></i><i></i><i></i></span><span class="mono">answer</span></div>
    <div class="body">
      <div class="summary">
        <div class="bar" style="width: 92%"></div>
        <div class="bar" style="width: 60%"></div>
      </div>
      <div class="row"><i></i><div class="bar" style="width: 78%"></div></div>
      <div class="row"><i></i><div class="bar" style="width: 62%"></div></div>
    </div>
  </div>
</div>
</body>
</html>
